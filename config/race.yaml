# ─────────────────────────────────────────────
# Carrera por la Cardidad — Configuration
# ─────────────────────────────────────────────

# Event metadata
event:
  name: "Carrera por la Caridad"
  titleLines:
    - text: "Carrera"
      faded: false
    - text: "Por La"
      faded: true
    - text: "Caridad"
      faded: false
  tagline: "Carrera Benéfica 2026"
  invitation: "Corre, trota o camina. Perfecto para todas las edades. ¡Trae a tu mascota!"
  date: "2026-05-17"
  time: "07:00"
  displayDate: "17 mayo"
  displayTime: "7:00 AM"
  fullDate: "Domingo 17 de mayo, 2026"
  maxCapacity: 300
  registrationDeadline: "16 de mayo"

# When true: thank-you landing — hero without register CTA, large banner headline, misión, ayuda y pie; sin evento/distancias/inscripción.
raceOver: false
raceOverBannerTitle: "Gracias"
raceOverMessage: |
  ¡Gracias por participar en la Carrera por la Caridad 2026!
  Nos vemos el próximo año.

# Google Forms embed URL for registration
registrationFormUrl: "https://docs.google.com/forms/d/e/1FAIpQLSeBHatDcmNbWfLyBziED359xIvDBWNBvGcbMUIjnUQg12oI4w/viewform?embedded=true"

# Registration pricing (shown in a global banner)
registration:
  price: 300
  currency: "MXN"
  # Modal content for the "Playera" card
  playeraImage: "/playera-2026.jpg"
  playeraImageAlt: "Playera conmemorativa edición 2026"
  # Modal content for the "Medalla" card
  medallaImage: "/medal.jpeg"
  medallaImageAlt: "Medalla de participación"
  # Modal content for the "100% Benéfico" card and the "despensa" link
  despensaTitle: "¿Qué puedo traer de despensa?"
  despensaItems:
    - "Arroz"
    - "Frijol"
    - "Aceite"
    - "Azúcar"
    - "Harina"
    - "Latas de atún"
    - "Sopas"
    - "Leche en polvo o tetrapac"
    - "Avena"
    - "Salsa de tomate"
    - "Jabón de baño o lavaplatos"
    - "Papel higiénico"

# Main location
location:
  name: "Parroquia Nuestra Señora de la Paz"
  description: "Calle Rancho el Retiro Sur 3517, Pradera Dorada. CP 32618"

# Categories / distancias
distancias:
  - id: "3k"
    name: "Ruta 3K"
    subtitle: "Caminata / Trote"
    distance: "3K"
    description: "Ideal para familias, principiantes o quienes prefieren un ritmo relajado. Puedes caminar, trotar o correr — tú decides."
    routeDescription: "Inicia el recorrido en la parroquia hasta el AutoZone de la calle Ejército Nacional, luego regresa a la parroquia."
    mapImage: "/maps/mapa-3k.png"
    mapUrl: "https://www.google.com/maps/d/edit?mid=1gsypjpHprzfQ_D0nq3yCWTAgaYF-0hk&usp=sharing"
    popular: false
    features:
      - text: "Playera conmemorativa"
        highlight: false
      - text: "Medalla de participación (para los primeros 300 participantes registrados)"
        highlight: false
      - text: "Hidratación y fruta"
        highlight: false
      - text: "Apta para niños acompañados"
        highlight: false

  - id: "5k"
    name: "Ruta 5K"
    subtitle: "Carrera"
    distance: "5K"
    description: "El recorrido completo para quienes buscan el reto. Ruta plana con estaciones de hidratación cada kilómetro."
    routeDescription: "Inicia el recorrido en la parroquia hasta el OXXO de la Ejército Nacional y Paseo de la Victoria, luego regresa a la parroquia."
    mapImage: "/maps/mapa-5k.png"
    mapUrl: "https://www.google.com/maps/d/edit?mid=14h5_nKzZNU--VnbOsqV6rOVA40O-gr4&usp=sharing"
    popular: true
    features:
      - text: "Playera conmemorativa"
        highlight: false
      - text: "Medalla de participación (para los primeros 300 participantes registrados)"
        highlight: false
      - text: "Hidratación y fruta"
        highlight: false

  - id: "10k"
    name: "Ruta 10K"
    subtitle: "Carrera"
    distance: "10K"
    description: "El recorrido más largo para los corredores más experimentados. Ruta plana con estaciones de hidratación cada kilómetro."
    routeDescription: "Inicia el recorrido en la parroquia hasta el DistMar de la Francisco Villareal Torres, luego regresa a la parroquia."
    mapImage: "/maps/mapa-10k.png"
    mapUrl: "https://www.google.com/maps/d/edit?mid=1GG52emTG7Ngb4hV15J6Hcg97GIuN3Zo&usp=sharing"
    popular: false
    features:
      - text: "Playera conmemorativa"
        highlight: false
      - text: "Medalla de participación (para los primeros 300 participantes registrados)"
        highlight: false
      - text: "Hidratación y fruta"
        highlight: false
      - text: "Premio en efectivo al 1°, 2° y 3° lugar en categoría masculina y femenina."
        highlight: true

# Pre-event schedule (kit pick-up)
preSchedule:
  tagline: "Recoge tu kit de corredor (playera y número) antes del evento."
  items:
    - date: "Sábado 9 de mayo"
      time: "9:00 AM - 12:00 PM"
      description: "Entrega de kits en la oficina de la parroquia"
    - date: "Viernes 15 de mayo"
      time: "10:00 AM - 7:00 PM"
      description: "Entrega de kits en la oficina de la parroquia"
    - date: "Sábado 16 de mayo"
      time: "10:00 AM - 7:00 PM"
      description: "Entrega de kits en la oficina de la parroquia"

# Schedule / timeline (ordered array)
schedule:
  - time: "6:45"
    title: "Calentamiento Grupal"
    description: "Sesión de estiramiento y calentamiento guiado para preparar el cuerpo."
    highlight: false
  - time: "7:00"
    title: "¡Arrancamos!"
    description: "Salida simultánea de las rutas 3K, 5K y 10K desde la parroquia."
    highlight: true
  - time: "9:00"
    title: "Premiación"
    description: "Entrega de premio en efectivo al 1°, 2° y 3° lugar del 10K en categoría masculina y femenina."
    highlight: false

